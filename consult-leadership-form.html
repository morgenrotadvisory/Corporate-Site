/* ---------- ボタン ---------- */
.btn-main {
  display: inline-block; text-decoration: none; text-align: center;
  background: #e8334a; color: #fff; border-radius: 100px;
  font-size: 0.98rem; font-weight: 500; letter-spacing: 0.05em;
  padding: 1.05rem 2.6rem;

}

  background: #d42741; transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(232,51,74,0.28);
}
.btn-sub {
  display: inline-block; text-decoration: none; text-align: center;
  background: #fff; color: #55504c; border: 1px solid #e8dcd6; border-radius: 100px;

/* ---------- 悩み ---------- */
#pain { text-align: center; }

  margin-top: 1.9rem; text-align: left;

}
.pain-close { margin-top: 1.9rem; font-size: 0.9rem; line-height: 2; color: #6d645e; }

/* ---------- 無料相談 ---------- */
.tl-row {
  display: grid; grid-template-columns: 86px 1fr; gap: 1.3rem;
  padding: 1.5rem 0; border-bottom: 1px dashed #eee0da;
}
.tl-row:first-of-type { border-top: 1px dashed #eee0da; }
.timeline { margin-top: 1.8rem; }
.tl-time {

  padding-top: 0.3rem; white-space: nowrap;
}
.tl-head { font-size: 0.95rem; font-weight: 500; color: #453f3b; margin-bottom: 0.5rem; }
.tl-body { font-size: 0.86rem; line-height: 1.95; color: #6d645e; }
.tl-body + .tl-body { margin-top: 0.65rem; }
.goal-note {

  padding: 1.3rem 1.5rem; font-size: 0.9rem; line-height: 1.95; color: #55504c;
}
.no-sell { margin-top: 1rem; font-size: 0.84rem; color: #9a8f88; }

/* ---------- コーチング ---------- */
.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; margin-top: 1.8rem; }
.svc-card {
  background: #fff; border: 1px solid #f6e9e4; border-radius: 16px;
  padding: 1.7rem 1.5rem;
  box-shadow: 0 6px 20px rgba(214,168,150,0.08);
}
.svc-name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; line-height: 1.45; margin-bottom: 0.6rem; }
.svc-desc { font-size: 0.83rem; line-height: 1.95; color: #6d645e; }

/* ---------- セミナー ---------- */
.offer-meta {
  display: inline-block; background: #fff; border: 1px solid #ffd9cd;
  border-radius: 100px; padding: 0.4rem 1.1rem; margin-top: 1.2rem;
  font-size: 0.76rem; color: #d9455a;
}
.offer-list { list-style: none; margin-top: 1.6rem; }
.offer-list li {
  position: relative; padding: 1.1rem 0 1.1rem 1.6rem;
  border-bottom: 1px dashed #eee0da;
}
.offer-list li:first-child { border-top: 1px dashed #eee0da; }
.offer-list li::before {
  content: ''; position: absolute; left: 0; top: 1.8rem;
  width: 6px; height: 6px; border-radius: 50%; background: #e8334a;
}
.offer-list .ol-head { font-size: 0.92rem; font-weight: 500; color: #453f3b; line-height: 1.6; }
.offer-list .ol-body { font-size: 0.85rem; line-height: 1.9; color: #6d645e; margin-top: 0.3rem; }

.sem-dates span {

.sem-dates b { font-weight: 500; color: #d9455a; margin-right: 0.4rem; }

.offer-cta .btn-main { min-width: 280px; }
.offer-cta .cta-subnote { margin-top: 0.8rem; }

  box-shadow: 0 10px 26px rgba(214,168,150,0.18);

  font-family: 'Raleway', sans-serif; font-size: 0.56rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: #ef6a7a;
  margin-bottom: 0.55rem;
}
.case-invite .ci-title {
  font-size: 1rem; font-weight: 500; color: #453f3b; line-height: 1.6;
  margin-bottom: 0.4rem; padding-right: 1.6rem;
}
.case-invite .ci-desc { font-size: 0.83rem; line-height: 1.9; color: #7a716b; }
.case-invite::after {
  content: '→'; position: absolute; right: 1.5rem; top: 50%;
  transform: translateY(-50%); color: #e8334a; font-size: 1rem;

/* ---------- 写真 ---------- */

.browse-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; margin-top: 1.8rem; }

.cta-subnote { margin-top: 0.7rem; font-size: 0.76rem; color: #9a8f88; }

footer { background: #fff; border-top: 1px solid #f6e9e4; padding: 2rem 6vw; text-align: center; }

/* ---------- reveal ---------- */
.reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity: 1; transform: none; }
.d1 { transition-delay: 0.07s; } .d2 { transition-delay: 0.14s; } .d3 { transition-delay: 0.21s; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .btn-main:hover { transform: none; }
}

@media (max-width: 700px) {
  section { padding: 3.4rem 6vw; }
  #hero { padding-top: 2.6rem; padding-bottom: 3rem; }

  .tl-time { padding-top: 0; }
  .btn-main { display: block; padding-left: 1.2rem; padding-right: 1.2rem; }
  .btn-sub { display: block; }
}
